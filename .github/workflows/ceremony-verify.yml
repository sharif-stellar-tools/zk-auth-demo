name: Ceremony Verify

on:
  pull_request:
    paths:
      - 'src/**/*.circom'
      - 'ceremony-artifacts/**'
      - 'ceremony-manifest.json'

jobs:
  verify:
    name: Verify ceremony artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify zk_auth circuit
        run: |
          npx ts-node scripts/ceremony/index.ts verify zk_auth \
            --artifacts ./ceremony-artifacts \
            --manifest ./ceremony-manifest.json
